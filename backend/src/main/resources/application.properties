server.port=8080

# ---- Database tier (MySQL) ----
# createDatabaseIfNotExist lets MySQL create the schema on first run.
   spring.datasource.url=jdbc:mysql://localhost:3306/loan_tracker?allowPublicKeyRetrieval=true&useSSL=false
   spring.datasource.username=loanapp
   spring.datasource.password=loanapp123

# "create" rebuilds the tables and reloads data.sql on every startup (good for demos).
# Switch to "update" and spring.sql.init.mode=never once you want data to persist.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false

# ---- Web tier origin allowed to call this API ----
app.cors.allowed-origins=http://localhost:5173

# ---- Loans ----
# The spec doesn't give a loan term; this is used when the admin leaves term blank.
app.loan.default-term-months=120

# ---- Email ----
# false = new-account emails are printed to the console instead of sent.
app.mail.enabled=false
app.mail.from=noreply@loantracker.local
# To really send, set app.mail.enabled=true and fill these in (Mailtrap shown):
# spring.mail.host=sandbox.smtp.mailtrap.io
# spring.mail.port=2525
# spring.mail.username=YOUR_USERNAME
# spring.mail.password=YOUR_PASSWORD
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
